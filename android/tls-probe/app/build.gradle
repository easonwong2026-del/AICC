// Throwaway probe: decides whether POKE4S can talk TLS to the AICC bridge.
// Deliberately dependency-free (no AndroidX) so it builds in seconds and has
// no runtime surface of its own.
plugins {
    id "com.android.application"
}

android {
    namespace "com.aieink.tlsprobe"
    compileSdk 35

    defaultConfig {
        applicationId "com.aieink.tlsprobe"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1"
    }
}
