[package]
name = "aicc-account-worker"
version = "0.1.0"
edition = "2021"
# 1.89 起 `std::fs::File::try_lock` 稳定：凭据目录的跨进程锁用它，
# 不引入额外依赖（libc / fs2）。CI 用 stable 工具链，满足这个下限。
rust-version = "1.89"
description = "AICC 账号与签到辅助进程：JSON-RPC over stdin/stdout，不监听任何端口"
license = "MIT"
publish = false

[[bin]]
name = "aicc-account-worker"
path = "src/main.rs"

[dependencies]
# 业务核心：上游 wb-switch-core（固定 commit，见 vendor/VENDOR.md）
wb-switch-core = { path = "vendor/crates/wb-switch-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 登录地址校验：主机必须走标准解析器，手工 split 与浏览器解析不一致（反斜杠即路径分隔符）。
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 额度看板要拿到 HTTP 状态码区分 401/429/5xx（vendored crate 已有同版本依赖，不新增下载）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 登录流程要跑异步 HTTP：一个 current-thread runtime 足够（RPC 本来就是串行的）。
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# 证书有效期由 rcgen 以 OffsetDateTime 表达，这里直接换算时间戳。
time = { version = "0.3", features = ["std"] }

# Qoder CN 本地认证解密：AES-128-CBC + PBKDF2-HMAC-SHA1
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
base64 = "0.22"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
# 证书元数据以 PEM 本身为准（notAfter / SAN），不能只信 identity.json。
x509-parser = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
