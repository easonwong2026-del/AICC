name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile collectors/magpie.py
          python -m py_compile server.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install flake8

      - name: Lint Python
        run: flake8 --max-line-length=140 --exclude=__pycache__,.git,dist,android,web .

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/poke-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: ./gradlew test assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poke4s-dashboard-apk
          path: android/poke-dashboard/app/build/outputs/apk/release/*.apk

  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run Widget status smoke tests
        run: bash scripts/smoke-test-widget.sh

      - name: Run shared display snapshot regression smoke
        run: bash scripts/smoke-test-display-snapshot.sh

      - name: Verify Widget layouts render in every state
        run: bash scripts/smoke-test-widget-visual.sh

      - name: Render companion settings acceptance images
        run: bash scripts/smoke-test-dashboard-visual.sh

      - name: Upload dashboard acceptance images
        uses: actions/upload-artifact@v4
        with:
          name: magpie-settings-visuals
          path: /private/tmp/aicc-dashboard-qa/*.png

      - name: Upload Widget acceptance images
        uses: actions/upload-artifact@v4
        with:
          name: magpie-widget-visuals
          path: /private/tmp/widget_qa/*.png

      - name: Run Swift core library tests
        run: swift test --package-path macos/MenuBarApp

  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static reference check
        run: |
          # Verify that removed symbols do not remain anywhere in the repository.
          # rg exits 1 when a match is found — invert so the step fails only
          # when a deleted symbol is unexpectedly still referenced.
          cd "$GITHUB_WORKSPACE"
          patterns=(
            "Codex""LaunchMonitor"
            "open""Codex\("
            "ocx""AutoStart"
            "ocx""StopOnCodexExit"
            "ocx""WaitProxy"
            "ocx""ServiceAddress"
            "menuBarShow""SystemHealth"
            "System"" Health"
            "Open"" Codex"
            "com\.openai\.""codex"
            "com\.openai\.""chatgpt"
          )
          failed=0
          for p in "${patterns[@]}"; do
            # --quiet: exit 0 when no match, exit 1 when match found.
            if rg --quiet --glob '!dist/**' "$p" .; then
              echo "FAIL: Pattern '$p' still found." >&2
              rg --glob '!dist/**' "$p" .
              failed=1
            else
              echo "OK: '$p' not found."
            fi
          done
          exit "$failed"

      - name: Build macOS app
        run: |
          BUNDLE_SERVER=1 bash macos/build-aicc-swiftui.sh

      - name: Validate sandboxed Widget bundle
        run: |
          bash scripts/validate-widget-bundle.sh
          bash scripts/smoke-test-widget-bundle.sh

      - name: Validate macOS scripts
        run: |
          for file in macos/*.sh; do bash -n "$file"; done
          for file in scripts/*.sh; do bash -n "$file"; done

      - name: Smoke test bundled server
        run: |
          bash scripts/smoke-test-bundled-server.sh "dist/mac/AICC.app/Contents/Resources/Server"

      - name: Build macOS DMG
        run: bash macos/build-dmg.sh

      - name: Validate DMG artifact exists
        run: |
          bash scripts/validate-version.sh --dmg
          hdiutil verify "dist/AICC-$(cat VERSION).dmg"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: aicc-macos-app
          path: dist/mac/AICC.app

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: aicc-macos-dmg
          path: dist/*.dmg

  android-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render native Android acceptance images
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke-test-android-visual.sh
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-android-visuals
          path: android-visuals/*.png
